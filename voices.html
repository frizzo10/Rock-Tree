<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Cooperstown Cash: Voice sampler</title>
<style>
:root { --bg: #F7F8F6; --ink: #19231E; --soft: #4A5560; --blue: #1F3F8F; --red: #A31212; --line: #B7BDC2; }
@media (prefers-color-scheme: dark) { :root { --bg: #1C201E; --ink: #E4E8E0; --soft: #A9B4AD; --blue: #7FA2F0; --line: #3a423e; } }
body { margin: 0; padding: 16px 16px 90px; background: var(--bg); color: var(--ink); font: 17px/1.4 system-ui, -apple-system, sans-serif; max-width: 560px; margin-inline: auto; }
h1 { font-size: 24px; margin: 8px 0; }
p { color: var(--soft); margin: 6px 0 14px; }
.row { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-top: 1px solid var(--line); }
.row .nm { flex: 1; min-width: 0; }
.row b { display: block; overflow-wrap: anywhere; }
.row small { color: var(--soft); }
button { font: 700 16px/1 system-ui, sans-serif; padding: 13px 20px; border-radius: 10px; border: 2px solid var(--blue); background: var(--blue); color: #fff; min-width: 84px; }
button.alt { background: transparent; color: var(--blue); }
#stop { position: fixed; left: 50%; transform: translateX(-50%); bottom: max(18px, env(safe-area-inset-bottom)); background: var(--red); border-color: #fff; border-radius: 999px; padding: 14px 26px; font-size: 17px; display: none; box-shadow: 0 4px 14px rgba(0,0,0,.45); z-index: 5; }
.pick { color: var(--blue); font-weight: 700; }
</style>
</head>
<body>
<h1>GM voice sampler</h1>
<p>Tap Play to hear each English voice on this phone. The ones marked "GM would use" are what the app picks first now.</p>
<div class="row"><div class="nm"><b>Line to read</b><small id="line"></small></div><button class="alt" id="shuf" type="button">Change line</button></div>
<div id="list"></div>
<button id="stop" type="button">Stop</button>
<script>
(function () {
  'use strict';
  const LINES = [
    'Good win, skipper. We got great starting pitching, and the bullpen shut the door in the ninth.',
    'Tough one, skipper. We were right there until the seventh, when the lead got away from us.',
    'What a ballgame, skipper! That home run in the eighth turned it all around.'
  ];
  let li = 0, playing = null;
  const $ = id => document.getElementById(id), synth = window.speechSynthesis;
  const score = v => { const n = v.name + ' ' + (v.voiceURI || ''); let sc = 0; if (/\btessa\b/i.test(n)) return 100; if (/premium|enhanced|natural|neural|siri/i.test(n)) sc += 6; if (/microsoft (guy|davis|ryan|christopher|eric|roger|steffan|brian)|google uk english male/i.test(n)) sc += 4; if (/\b(daniel|alex|aaron|evan|fred|oliver|arthur|guy|ryan|david|mark|james|tom|thomas|gordon|lee|rishi|reed|eddy|rocko|grandpa|christopher|eric|roger|steffan|brian|male)\b/i.test(n)) sc += 12; if (/\b(samantha|karen|moira|tessa|fiona|victoria|allison|ava|susan|zira|aria|jenny|sonia|libby|hazel|catherine|kate|serena|veena|nicky|joelle|nora|kathy|princess|shelley|sandy|flo|grandma|female)\b|google (us|uk) english(?! male)/i.test(n)) sc -= 12; if (/compact|espeak|novelty|whisper|zarvox|bad news|bells|boing|bubbles|cellos|deranged|good news|hysterical|jester|organ|trinoids|wobble/i.test(n)) sc -= 9; if (/^en[-_]US/i.test(v.lang)) sc += 2; if (v.localService === false) sc += 1; return sc; };
  function stop() { try { synth.cancel(); } catch (e) {} playing = null; $('stop').style.display = 'none'; document.querySelectorAll('.row button[data-v]').forEach(b => b.textContent = 'Play'); }
  function play(v, btn) {
    stop(); const u = new SpeechSynthesisUtterance(LINES[li]); u.voice = v; u.lang = v.lang; u.rate = .98; u.pitch = 1; u.volume = 1;
    u.onend = u.onerror = () => { if (playing === v) stop(); };
    playing = v; btn.textContent = 'Playing'; $('stop').style.display = 'block'; synth.speak(u);
  }
  function draw() {
    $('line').textContent = '"' + LINES[li] + '"';
    if (!synth || typeof SpeechSynthesisUtterance === 'undefined') { $('list').innerHTML = '<p>This browser cannot speak out loud.</p>'; return; }
    const vs = (synth.getVoices() || []).filter(v => /^en[-_]/i.test(v.lang) || v.lang === 'en').sort((a, b) => score(b) - score(a) || a.name.localeCompare(b.name));
    if (!vs.length) { $('list').innerHTML = '<p>No English voices found yet. Wait a second and this will fill in.</p>'; return; }
    const top = vs[0], list = $('list'); list.innerHTML = '';
    vs.forEach(v => {
      const r = document.createElement('div'); r.className = 'row';
      const nm = document.createElement('div'); nm.className = 'nm';
      const b = document.createElement('b'); b.textContent = v.name; nm.appendChild(b);
      const s = document.createElement('small'); s.innerHTML = v.lang.replace('_', '-') + (v === top ? ' &middot; <span class="pick">GM would use</span>' : ''); nm.appendChild(s);
      const btn = document.createElement('button'); btn.type = 'button'; btn.textContent = 'Play'; btn.dataset.v = '1'; btn.onclick = () => playing === v ? stop() : play(v, btn);
      r.appendChild(nm); r.appendChild(btn); list.appendChild(r);
    });
  }
  $('shuf').onclick = () => { stop(); li = (li + 1) % LINES.length; draw(); };
  $('stop').onclick = stop;
  if (synth) { synth.onvoiceschanged = draw; setTimeout(draw, 300); }
  draw();
  addEventListener('pagehide', stop); document.addEventListener('visibilitychange', () => { if (document.hidden) stop(); });
})();
</script>
</body>
</html>
