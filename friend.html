<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cooperstown Cash: Play a friend</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Condensed:wght@400;500;600&family=Permanent+Marker&display=swap" rel="stylesheet">
<style>
:root {
  --marker: 'Permanent Marker', 'Comic Sans MS', 'Chalkboard SE', cursive;
  --text: 'IBM Plex Sans Condensed', 'Arial Narrow', 'Helvetica Neue', Arial, sans-serif;
  --wall: #CED2CF; --ink: #19231E; --ink-soft: #4A5560; --wb: #F7F8F6; --wb-ink: #1F3F8F; --wb-red: #C0392B; --wb-green: #1E7B45; --wb-frame: #B7BDC2; --lamp: #F2B33D;
  box-sizing: border-box; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --wall: #1C201E; --ink: #E4E8E0; --ink-soft: #A9B4AD; } }
:root[data-theme="dark"] { --wall: #1C201E; --ink: #E4E8E0; --ink-soft: #A9B4AD; }
*, *::before, *::after { box-sizing: inherit; }
[hidden] { display: none !important; }
body { margin: 0; background: var(--wall); color: var(--ink); font: 16px/1.5 var(--text); }
button, select { font: inherit; }
:focus-visible { outline: 3px solid var(--lamp); outline-offset: 2px; }
.wrap { max-width: 720px; margin: 0 auto; padding: 18px 16px 48px; }
.crumbs { margin: 0 0 10px; font-size: 14px; display: flex; align-items: center; gap: 10px; }
.crumbs a { color: var(--ink); font-weight: 600; }
.crumbs .badge { width: 52px; height: 52px; display: block; }
.crumbs .badge img { width: 100%; height: 100%; }
.board { background: var(--wb); color: #20262D; border-radius: 4px; box-shadow: inset 0 0 0 8px var(--wb-frame), 0 3px 0 rgba(0,0,0,.18); padding: 22px 26px 20px; margin-bottom: 16px; }
.board h1 { font: 400 clamp(28px, 6vw, 42px)/1.05 var(--marker); color: var(--wb-ink); margin: 0 0 8px; }
.board h2 { font: 400 24px/1.15 var(--marker); color: var(--wb-ink); margin: 0 0 8px; }
.board p { margin: 0 0 10px; color: #3A434D; }
.field { margin: 14px 0; }
.field label { display: block; font-weight: 600; font-size: 14px; margin-bottom: 4px; }
.field select { width: 100%; padding: 11px 12px; border: 1.5px solid #8C959E; border-radius: 4px; background: #fff; color: #1B1F24; }
.btn { border: 0; border-radius: 4px; padding: 11px 18px; font-weight: 600; cursor: pointer; text-decoration: none; display: inline-block; line-height: 1.4; }
.btn-main { background: var(--wb-ink); color: #fff; }
.btn-main:hover { background: #17306E; }
.btn-alt { background: transparent; color: #20262D; border: 1.5px solid #8C959E; }
.btn-alt:hover { background: #E9ECEA; }
.btn[disabled] { opacity: .5; cursor: default; }
.acts { display: flex; flex-wrap: wrap; gap: 10px; margin: 14px 0 6px; }
.msg { min-height: 1.4em; margin: 6px 0 0; font-weight: 600; color: var(--wb-green); }
.msg.err { color: var(--wb-red); }
.vs { display: grid; grid-template-columns: 1fr auto 1fr; gap: 10px; align-items: center; margin: 14px 0; }
.side { text-align: center; padding: 12px 8px; border-radius: 4px; background: #fff; border: 1.5px solid #C9CFD4; min-width: 0; }
.side .av { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; margin: 0 auto 6px; font-size: 24px; background: var(--c, #8C959E); }
.side b { display: block; overflow-wrap: anywhere; }
.side span { font-size: 14px; color: #4A5560; }
.side.wait { border-style: dashed; color: #5A6470; }
.vs .at { font: 400 22px var(--marker); color: var(--wb-red); }
.linkbox { background: #fff; border: 1.5px solid #C9CFD4; border-radius: 4px; padding: 10px 12px; font-size: 14px; overflow-wrap: anywhere; user-select: all; }
.league { background: #FFF3A0; color: #2A2A2A; border-radius: 2px; padding: 12px 16px; box-shadow: 0 3px 6px rgba(0,0,0,.2); margin-top: 16px; }
.league h2 { font: 400 20px/1.2 var(--marker); color: var(--wb-red); margin: 0 0 4px; }
.league p { margin: 0 0 8px; color: #2A2A2A; }
@media (max-width: 420px) { .board { padding: 18px 18px; } .vs { grid-template-columns: 1fr; } .vs .at { text-align: center; } }
</style>
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<script src="vendor/supabase-2.117.2.js"></script>
<script src="cloud.js"></script>
<link rel="stylesheet" href="mobile.css">
</head>
<body>
<div class="wrap">
  <nav class="crumbs"><a class="badge" href="index.html"><img src="logo.webp" alt="Cooperstown Cash home" width="52" height="52"></a><a href="index.html">Home</a><a href="solo.html" style="margin-left:14px">Play solo</a></nav>
  <main id="app"><section class="board"><p>Loading…</p></section></main>
</div>
<script>
(() => {
  const $ = id => document.getElementById(id);
  const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  // the same sixteen great clubs as a quick game: [key, year, nickname, wins, losses]
  const CLUBS = [["1906CHN",1906,"Cubs",116,36],["1927NYA",1927,"Yankees",110,44],["1929PHA",1929,"Athletics",104,46],["1939NYA",1939,"Yankees",106,45],["1954CLE",1954,"Indians",111,43],["1955BRO",1955,"Dodgers",98,55],["1961NYA",1961,"Yankees",109,53],["1970BAL",1970,"Orioles",108,54],["1975CIN",1975,"Reds",108,54],["1984DET",1984,"Tigers",104,58],["1986NYN",1986,"Mets",108,54],["1998NYA",1998,"Yankees",114,48],["2001SEA",2001,"Mariners",116,46],["2004BOS",2004,"Red Sox",98,64],["2016CHN",2016,"Cubs",103,58],["2022LAN",2022,"Dodgers",111,51]];
  const clubName = k => { const c = CLUBS.find(x => x[0] === k); return c ? `${c[1]} ${c[2]}` : k; };
  const options = sel => CLUBS.map(c => `<option value="${c[0]}"${c[0] === sel ? ' selected' : ''}>${c[1]} ${esc(c[2])} (${c[3]}-${c[4]})</option>`).join('');
  const qs = new URLSearchParams(location.search), joinCode = qs.get('join'), gameId = qs.get('g');
  const app = $('app'); let timer = null;
  const client = () => window.CC && window.CC.client;
  const say = (id, t, err) => { const m = $(id); if (m) { m.textContent = t || ''; m.className = 'msg' + (err ? ' err' : ''); } };
  const avatar = p => `<div class="av" style="--c:${esc(p && p.color || '#8C959E')}">${esc(p && p.emoji || '⚾')}</div>`;
  const side = (p, you) => p ? `<div class="side">${avatar(p)}<b>${esc(p.name)}${you ? ' (you)' : ''}</b><span>${esc(clubName(p.team))}</span></div>` : `<div class="side wait"><div class="av" style="--c:#C9CFD4">?</div><b>Waiting for your friend</b><span>to open the link</span></div>`;

  const leagueNote = `<div class="league"><h2>Be the commissioner</h2><p>You and your friend are already a league. Make it official: as commissioner you pick the schedule, invite the rest of your crew, and run a full season with standings and a champion. Every game is played for real.</p><p><a class="btn btn-main" href="private.html">Start a private league</a></p></div>`;

  function needSignIn(heading, again) {
    app.innerHTML = `<section class="board"><h1>Play a friend</h1><p>${esc(heading)}</p><div class="acts"><button class="btn btn-main" id="si" type="button">Sign in</button></div></section>`;
    $('si').onclick = () => { window.CC.requireSignIn(heading); };
    window.addEventListener('cc-auth', e => { if (e.detail && e.detail.user) again(); }, { once: true });
  }

  // ---- 1. the host picks a club and gets a link ----
  function drawStart() {
    app.innerHTML = `<section class="board"><h1>Play a friend</h1>
      <p>Challenge a friend to a game. Pick your club and send them a link. They open it, pick their club, and you are set to play each other.</p>
      <p><b>Run the show.</b> Friends who play each other tend to want a whole season. You can be the commissioner of a private league for your crew; <a href="private.html">see how it works</a>.</p>
      <div class="field"><label for="mine">Pick your club</label><select id="mine">${options('1975CIN')}</select></div>
      <div class="acts"><button class="btn btn-main" id="go" type="button">Get a link for my friend</button></div><p class="msg" id="m" role="status"></p></section>`;
    $('go').onclick = async () => {
      if (!window.CC.requireSignIn('Sign in to challenge a friend')) return;
      $('go').disabled = true; say('m', 'Setting up your game…');
      const { data, error } = await client().rpc('create_friend_game', { p_team: $('mine').value });
      $('go').disabled = false;
      if (error) return say('m', error.message, true);
      location.href = 'friend.html?g=' + encodeURIComponent(data.id);
    };
  }

  // ---- 2. the friend opens the link ----
  async function drawJoin() {
    const { data, error } = await client().rpc('friend_game_preview', { p_code: joinCode });
    if (error) { app.innerHTML = `<section class="board"><h1>Play a friend</h1><p>${esc(error.message)}</p><div class="acts"><a class="btn btn-main" href="friend.html">Start my own game</a></div></section>`; return; }
    if (data.mine || data.joined) { location.replace('friend.html?g=' + encodeURIComponent(data.id)); return; }
    if (data.status !== 'open') { app.innerHTML = `<section class="board"><h1>Play a friend</h1><p>Someone has already joined this game.</p><div class="acts"><a class="btn btn-main" href="friend.html">Start my own game</a></div></section>`; return; }
    const h = data.host;
    app.innerHTML = `<section class="board"><h1>${esc(h.name)} wants to play you</h1>
      <div class="vs">${side(h)}<div class="at">vs</div><div class="side wait"><div class="av" style="--c:#C9CFD4">?</div><b>You</b><span>pick a club</span></div></div>
      <div class="field"><label for="mine">Pick your club</label><select id="mine">${options('1927NYA')}</select></div>
      <div class="acts"><button class="btn btn-main" id="go" type="button">Join the game</button></div><p class="msg" id="m" role="status"></p></section>`;
    $('go').onclick = async () => {
      $('go').disabled = true; say('m', 'Joining…');
      const r = await client().rpc('join_friend_game', { p_code: joinCode, p_team: $('mine').value });
      $('go').disabled = false;
      if (r.error) return say('m', r.error.message, true);
      location.href = 'friend.html?g=' + encodeURIComponent(r.data.id);
    };
  }

  // ---- 3. the waiting room ----
  let lastSig = '';
  async function drawGame() {
    const { data: s, error } = await client().rpc('friend_game_state', { p_id: gameId });
    if (error) { app.innerHTML = `<section class="board"><h1>Play a friend</h1><p>${esc(error.message)}</p><div class="acts"><a class="btn btn-main" href="friend.html">Start a game</a></div></section>`; return; }
    const sig = s.status + (s.guest ? 'g' : ''); if (sig === lastSig) return; lastSig = sig;
    const host = s.you_are === 'host', link = location.origin + location.pathname.replace(/[^/]*$/, '') + 'friend.html?join=' + encodeURIComponent(s.code);
    if (s.status === 'cancelled') { clearInterval(timer); app.innerHTML = `<section class="board"><h1>Play a friend</h1><p>This game was cancelled.</p><div class="acts"><a class="btn btn-main" href="friend.html">Start a new game</a></div></section>`; return; }
    const ready = s.status !== 'open';
    app.innerHTML = `<section class="board"><h1>${ready ? 'Both clubs are set' : 'Send this link to your friend'}</h1>
      <div class="vs">${side(s.host, host)}<div class="at">vs</div>${side(s.guest, !host)}</div>
      ${ready ? `<p>You are both in. Live play, where you each make your own calls on your own phone, is coming next. This game will be here when it is ready.</p>` :
        host ? `<div class="linkbox" id="lk">${esc(link)}</div><div class="acts"><button class="btn btn-main" id="share" type="button">Send the link</button><button class="btn btn-alt" id="copy" type="button">Copy the link</button></div><p class="msg" id="m" role="status"></p><p>This page updates by itself when your friend joins.</p>` : ''}
      ${host && !ready ? '<div class="acts"><button class="btn btn-alt" id="cancel" type="button">Cancel this game</button></div>' : ''}
      </section>${leagueNote}`;
    if (host && !ready) {
      $('share').onclick = async () => { const text = `Play me at baseball on Cooperstown Cash: ${link}`; try { if (navigator.share) { await navigator.share({ text, url: link }); return; } } catch (e) { if (e && e.name === 'AbortError') return; } copy(link); };
      $('copy').onclick = () => copy(link);
      $('cancel').onclick = async () => { if (!confirm('Cancel this game?')) return; await client().rpc('cancel_friend_game', { p_id: gameId }); lastSig = ''; drawGame(); };
    }
    if (ready) clearInterval(timer);
  }
  async function copy(t) { try { await navigator.clipboard.writeText(t); say('m', 'Link copied. Paste it in a text to your friend.'); } catch (e) { say('m', 'Press and hold the link above to copy it.', true); } }

  function route() {
    clearInterval(timer);
    if (gameId) { drawGame(); timer = setInterval(() => { if (!document.hidden) drawGame(); }, 4000); }
    else if (joinCode) drawJoin();
    else drawStart();
  }
  window.CC ? window.CC.whenReady(() => {
    if (!client()) { app.innerHTML = '<section class="board"><h1>Play a friend</h1><p>We couldn\'t reach the server. Refresh the page and try again.</p></section>'; return; }
    if (gameId || joinCode) { window.CC.user ? route() : needSignIn(joinCode ? 'Sign in to join this game' : 'Sign in to see your game', route); }
    else route();
  }) : (app.innerHTML = '<section class="board"><p>Refresh the page and try again.</p></section>');
})();
</script>
</body>
</html>
