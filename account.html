<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cooperstown Cash: Your account</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Condensed:wght@400;500;600&family=Permanent+Marker&display=swap" rel="stylesheet">
<style>
:root {
  --marker: 'Permanent Marker', 'Comic Sans MS', 'Chalkboard SE', cursive;
  --text: 'IBM Plex Sans Condensed', 'Arial Narrow', 'Helvetica Neue', Arial, sans-serif;
  --wall: #CED2CF; --ink: #19231E; --ink-soft: #4A5560; --wb: #F7F8F6; --wb-ink: #1F3F8F; --wb-red: #C0392B; --wb-green: #1E7B45; --wb-frame: #B7BDC2; --lamp: #F2B33D;
  box-sizing: border-box; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --wall: #1C201E; --ink: #E4E8E0; --ink-soft: #A9B4AD; } }
:root[data-theme="dark"] { --wall: #1C201E; --ink: #E4E8E0; --ink-soft: #A9B4AD; }
html { scroll-padding-top: env(safe-area-inset-top, 0px); }
*, *::before, *::after { box-sizing: inherit; }
[hidden] { display: none !important; }
body { margin: 0; background: var(--wall); color: var(--ink); font: 16px/1.5 var(--text); }
button, input { font: inherit; }
:focus-visible { outline: 3px solid var(--lamp); outline-offset: 2px; }
.wrap { max-width: 1180px; margin: 0 auto; padding: 18px 16px 48px; }
.crumbs { margin: 0 0 10px; font-size: 14px; display: flex; align-items: center; gap: 10px; }
.crumbs a { color: var(--ink); font-weight: 600; }
.crumbs .badge { width: 52px; height: 52px; display: block; }
.crumbs .badge img { width: 100%; height: 100%; }

.board { background: var(--wb); color: #20262D; border-radius: 4px; box-shadow: inset 0 0 0 8px var(--wb-frame), 0 3px 0 rgba(0,0,0,.18); padding: 22px 28px 20px; }
.board h1 { font: 400 clamp(30px, 5.5vw, 48px)/1.05 var(--marker); color: var(--wb-ink); margin: 0 0 6px; }
.board p { margin: 0; max-width: 64ch; color: #3A434D; }
.stats { margin-top: 12px !important; font-weight: 600; color: var(--wb-green) !important; }
.pad { background: #FFF3A0 repeating-linear-gradient(#FFF3A0 0 25px, #C9D6E6 25px 26px); color: #2A2A2A; border-radius: 2px; padding: 10px 16px 12px 42px; position: relative; box-shadow: 0 3px 6px rgba(0,0,0,.18); margin: 16px 0 0; }
.pad::before { content: ''; position: absolute; left: 30px; top: 0; bottom: 0; width: 2px; background: #E7A0A0; }
.pad h2 { font: 400 20px/26px var(--marker); color: var(--wb-red); margin: 0; }
.pad p, .pad li { line-height: 26px; margin: 0; }
.pad ul { margin: 0; padding-left: 18px; }

.controls { display: flex; flex-wrap: wrap; gap: 10px 22px; align-items: center; margin: 20px 0 14px; }
.tabs, .chips { display: flex; gap: 6px; flex-wrap: wrap; }
.tab { background: transparent; border: 1.5px solid #8C959E; color: var(--ink); border-radius: 4px; padding: 8px 16px; font: 400 19px/1 var(--marker); cursor: pointer; }
.tab[aria-pressed="true"] { background: var(--wb-ink); border-color: var(--wb-ink); color: #fff; }
.tab small { font: 600 12px var(--text); margin-left: 6px; opacity: .85; }
.chip { background: transparent; border: 1px solid #8C959E; color: var(--ink); border-radius: 16px; padding: 5px 14px; font-weight: 600; font-size: 14px; cursor: pointer; }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--wall); border-color: var(--ink); }

.btn { border: 0; border-radius: 4px; padding: 10px 18px; font-weight: 600; cursor: pointer; }
.btn-main { background: var(--wb-ink); color: #fff; }
.btn-main:hover { background: #17306E; }
.btn-alt { background: transparent; color: #20262D; border: 1.5px solid #8C959E; }
.btn-alt:hover { background: #E9ECEA; }
.btn[disabled] { opacity: .5; cursor: default; }

.wallet { background: var(--wb); color: #20262D; border-radius: 4px; box-shadow: inset 0 0 0 5px var(--wb-frame); padding: 10px 18px; margin: 0 0 16px; }
.wallet .wl b { font: 400 28px/1 var(--marker); color: var(--wb-ink); margin-right: 4px; }
.wallet .wl span { font-size: 13.5px; color: #4A5560; margin-left: 10px; }
.wallet details { font-size: 13.5px; margin-top: 4px; }
.wallet summary { cursor: pointer; font-weight: 600; }
.wallet ul { margin: 4px 0 0; padding-left: 18px; }
.mine { display: grid; gap: 8px; margin-bottom: 18px; }
.mine .pad { margin: 0; }
.mine .row { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; justify-content: space-between; padding: 2px 0; }
.mine .pad .btn { padding: 4px 12px; }
a.btn { text-decoration: none; display: inline-block; line-height: 1.4; }
.mine .acts { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }

.tables { display: grid; grid-template-columns: repeat(auto-fill, minmax(330px, 1fr)); gap: 20px; }
.tbl { background: var(--wb); color: #20262D; border-radius: 4px; box-shadow: inset 0 0 0 6px var(--wb-frame), 0 2px 0 rgba(0,0,0,.18); padding: 20px 22px 18px; display: flex; flex-direction: column; }
.tbl h3 { font: 400 24px/1.1 var(--marker); color: var(--wb-ink); margin: 0 0 6px; }
.tags { display: flex; gap: 6px; flex-wrap: wrap; }
.tag { font-size: 12px; font-weight: 600; padding: 2px 9px; border-radius: 10px; background: #E3E6E4; color: #3A434D; }
.tag.free { background: #D8E8DC; color: #17603A; }
.fmt { font-size: 13.5px; color: #4A5560; margin: 6px 0 0; }
.felt { position: relative; aspect-ratio: 5 / 3; margin: 8px 0 4px; }
.felt::before { content: ''; position: absolute; inset: 15% 9%; border-radius: 50%; background: radial-gradient(ellipse at 50% 40%, #2C6B4B, #1F5039); border: 7px solid #6A4A2C; box-shadow: inset 0 0 14px rgba(0,0,0,.35), 0 2px 4px rgba(0,0,0,.3); }
.felt .count { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; color: #F3EAD3; pointer-events: none; }
.felt .count b { font: 400 34px/1 var(--marker); }
.felt .count small { font-size: 12px; opacity: .9; }
.seats { list-style: none; margin: 0; padding: 0; }
.seat { position: absolute; width: 14%; aspect-ratio: 1; transform: translate(-50%, -50%); border-radius: 50%; display: grid; place-items: center; font: 400 13px/1 var(--marker); }
.seat.open { border: 2px dashed #8C959E; background: rgba(247, 248, 246, .92); color: #5A6470; font-family: var(--text); font-weight: 600; }
.seat.taken { background: var(--c); color: #fff; border: 2px solid #fff; box-shadow: 0 1px 3px rgba(0,0,0,.45); }
.seat.me { outline: 3px solid var(--lamp); outline-offset: 1px; }
.tbl details { font-size: 13.5px; color: #3A434D; margin: 2px 0 10px; }
.tbl summary { cursor: pointer; font-weight: 600; }
.tbl details ul { margin: 4px 0 0; padding-left: 18px; columns: 2; }
.tbl .go { margin-top: auto; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.tbl .go .youare { font-size: 14px; font-weight: 600; color: var(--wb-green); }
.empty, .msg { background: var(--wb); color: #20262D; border-radius: 4px; box-shadow: inset 0 0 0 6px var(--wb-frame); padding: 22px 26px; grid-column: 1 / -1; }
.toast { min-height: 1.5em; margin: 0 0 8px; font-weight: 600; color: var(--wb-green); }
.toast.err { color: var(--wb-red); }
.cash h2, .how h2 { font: 400 26px/1.15 var(--marker); color: var(--wb-ink); margin: 0 0 8px; }
.cash .panel, .how .panel { background: var(--wb); color: #20262D; border-radius: 4px; box-shadow: inset 0 0 0 6px var(--wb-frame); padding: 20px 24px; }
.cash ul, .how ol { margin: 0 0 4px; padding-left: 20px; }
.cash li, .how li { margin: 4px 0; }
.how { margin-top: 30px; }
dialog { border: 0; padding: 0; background: transparent; max-width: 100%; }
dialog::backdrop { background: rgba(28, 32, 30, .8); }
.dlg { background: var(--wb); color: #20262D; border-radius: 4px; box-shadow: inset 0 0 0 8px var(--wb-frame); padding: 28px 30px 24px; width: min(440px, 92vw); }
.dlg h2 { font: 400 26px/1.1 var(--marker); color: var(--wb-ink); margin: 0 0 6px; }
.dlg p { margin: 0 0 12px; color: #3A434D; }
.dlg label { font-weight: 600; font-size: 14px; display: block; margin-bottom: 4px; }
.dlg input { width: 100%; padding: 11px 12px; border: 1.5px solid #8C959E; border-radius: 4px; background: #fff; color: #1B1F24; }
.dlg .note { font-size: 13px; color: #5A6470; margin: 6px 0 12px; }
.dlg .err { color: var(--wb-red); font-weight: 600; min-height: 1.4em; margin: 0 0 8px; }
.dlg .row { display: flex; gap: 10px; flex-wrap: wrap; }
footer { margin-top: 28px; font-size: 13px; color: var(--ink-soft); max-width: 80ch; }
footer p { margin: 0 0 6px; }
@media (max-width: 560px) { .tables { grid-template-columns: 1fr; } .board { padding: 18px 20px; } .tbl details ul { columns: 1; } }
@media (prefers-reduced-motion: no-preference) { .tbl { transition: transform .15s; } .tbl:hover { transform: translateY(-2px); } }
.invite .acts { display: flex; flex-wrap: wrap; gap: 10px; margin: 14px 0 8px; } .invite .invmsg { min-height: 1.4em; margin: 4px 0; font-weight: 600; color: #17603A; } .invite .invsmall { margin: 8px 0 0; font-size: 15px; }
</style>
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<script src="vendor/supabase-2.117.2.js"></script>
<script src="cloud.js"></script>
<script src="playinvite.js" defer></script>
<script src="charts.js"></script>
<link rel="stylesheet" href="mobile.css">
</head>
<body>
<div class="wrap">
  <nav class="crumbs"><a class="badge" href="index.html"><img src="logo.webp" alt="Cooperstown Cash home" width="52" height="52"></a><a href="index.html">Home</a><a href="howtoplay.html" style="margin-left:14px">How to play</a><a href="notebook.html" style="margin-left:14px">Notebook</a></nav>
  <header class="board"><h1>Your account</h1><p id="who" class="note">Loading…</p></header>
  <div id="box" aria-live="polite"></div>
  <footer>
    <p>Prototype for testing.</p>
    <p><a href="terms.html" style="color:inherit;font-weight:600">Terms of Service</a> &middot; <a href="privacy.html" style="color:inherit;font-weight:600">Privacy Policy</a></p>
  </footer>
</div>
<script>
(() => {
  const $ = id => document.getElementById(id), esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const EMOJIS = ["⚾", "🧢", "🏟️", "🌭", "🧤", "🔥", "⭐", "🏆", "🥇", "🎯", "🦅", "🐻", "🐯", "🦁", "🐺", "🦊", "🐸", "🐢", "🐙", "🦈", "🐝", "🦉", "🐴", "🐘", "🦬", "🚀", "⚡", "🌟", "👑", "💎", "🍀", "🌵", "🌲", "🌊", "☀️", "🌙", "🎩", "😎", "🤠", "🧠", "💪", "🎸", "🍕", "🥎"], COLORS = [["#1F3F8F", "Blue"], ["#9E2B22", "Red"], ["#1E7B45", "Green"], ["#B07D10", "Gold"], ["#5B3A8C", "Purple"], ["#0F6E7A", "Teal"], ["#C2571A", "Orange"], ["#3A3F47", "Slate"], ["#C0457B", "Pink"], ["#2B2B2B", "Black"]];   // the same lists the server accepts
  const STATUS = { open: 'Filling up', full: 'Full, waiting to start', started: 'Season under way', complete: 'Season finished', canceled: 'Canceled' };
  const THEME = { eighties: '1980s Legends', modern: 'Modern All-Stars', dynasty: 'All-Time Dynasty' };
  const when = d => { try { return new Date(d).toLocaleDateString(undefined, { year: 'numeric', month: 'long', day: 'numeric' }); } catch (e) { return ''; } };
  const where = l => l.status === 'started' || l.status === 'complete' ? `season.html?league=${l.id}` : l.is_public ? 'lobby.html' : 'private.html';
  async function paint() {
    const cc = window.CC, box = $('box');
    if (!cc || !cc.client) { $('who').textContent = ''; box.innerHTML = '<section class="board"><p><b>We couldn\'t reach the server.</b> Check your connection and refresh the page.</p></section>'; return; }
    if (!cc.user) { $('who').textContent = ''; box.innerHTML = '<section class="board"><h2 style="margin-top:0">Sign in to see your account</h2><p>You sign in with your email. We send you a code, so there is no password to remember. If this is your first time, signing in creates your account.</p><p><button class="btn btn-main" id="go" type="button">Sign in</button></p></section>'; $('go').onclick = () => cc.requireSignIn && cc.requireSignIn('Sign in to see your account'); return; }
    const uid = cc.user.id, c = cc.client;
    const [pr, st, nt] = await Promise.all([c.from('profiles').select('created_at,avatar_emoji,avatar_color').eq('id', uid), c.from('seats').select('league_id,seat_no,club_name').eq('user_id', uid), c.rpc('get_email_notices')]);
    const prow = (pr.data && pr.data[0]) || {}, since = prow.created_at, seats = st.data || [];
    let leagues = []; if (seats.length) { const r = await c.from('leagues').select('id,name,status,is_public,theme').in('id', seats.map(s => s.league_id)); leagues = r.data || []; }
    const by = new Map(leagues.map(l => [l.id, l])), mine = seats.map(s => ({ s, l: by.get(s.league_id) })).filter(x => x.l);
    const order = { started: 0, open: 1, full: 2, complete: 3, canceled: 4 }; mine.sort((a, b) => (order[a.l.status] ?? 9) - (order[b.l.status] ?? 9));
    $('who').innerHTML = `Signed in as <b>${esc(cc.user.email || 'your email')}</b>${since ? `. Member since ${esc(when(since))}.` : '.'}`;
    box.innerHTML = `
      <section class="board" id="avSec"><h2 style="margin-top:0">Your avatar</h2><p>Pick an emoji and a color. It shows at the top of every page, and you tap it to come back here.</p>
        <div class="avrow"><span class="av big" id="avPrev" aria-hidden="true"></span><span id="avName" class="note"></span></div>
        <p id="avEditRow" hidden><button class="btn btn-alt" id="avEdit" type="button">Change my avatar</button></p>
        <div id="avPicker">
        <div role="radiogroup" aria-label="Emoji" class="avgrid">${EMOJIS.map(e => `<button type="button" role="radio" class="avb" data-emoji="${e}" aria-checked="false" aria-label="${e}">${e}</button>`).join('')}</div>
        <div id="avRewards"></div>
        <div role="radiogroup" aria-label="Color" class="avcols">${COLORS.map(([c, n]) => `<button type="button" role="radio" class="avc" data-color="${c}" aria-checked="false" aria-label="${n}" title="${n}" style="background:${c}"></button>`).join('')}</div>
        <p class="avact"><button class="btn btn-main" id="avSave" type="button" disabled>Save my avatar</button> <button class="btn btn-alt" id="avReset" type="button">Use the default</button></p>
        </div>
        <p class="note" id="avMsg" role="status" aria-live="polite"></p></section>
      <section class="board"><h2 style="margin-top:0">Your leagues and tables</h2>${mine.length ? `<ul class="acl">${mine.map(({ s, l }) => `<li><a href="${where(l)}"><b>${esc(l.name)}</b></a><span class="note">${esc(s.club_name)} &middot; ${esc(STATUS[l.status] || l.status)}${THEME[l.theme] ? ' &middot; ' + esc(THEME[l.theme]) : ''}</span></li>`).join('')}</ul>` : '<p>You aren\'t in a league yet.</p><p><a class="btn btn-main" href="lobby.html">Find a free table</a> <a class="btn btn-alt" href="private.html">Start a private league</a></p>'}</section>
      <section class="board" id="invSec" hidden></section>
      <section class="board"><h2 style="margin-top:0">Your record</h2><p>Your wins, your quick games and the legends you have unlocked.</p><p><a class="btn btn-alt" href="career.html">See my record</a></p><div id="acCharts"></div></section>
      <section class="board" id="kcSec" hidden></section>
      <section class="board"><h2 style="margin-top:0">Emails</h2><p>We send league emails to <b>${esc(cc.user.email || 'the email on your account')}</b>.</p><label class="opt" style="display:flex;gap:10px;align-items:center;min-height:44px"><input type="checkbox" id="on" ${nt.data ? 'checked' : ''} style="width:22px;height:22px"> Email me about my tables and leagues</label><p class="note" id="saved" role="status" aria-live="polite"></p></section>${window.CC_NATIVE && window.CC_NATIVE.enablePush ? '<section class="board" id="pushSec"><h2 style="margin-top:0">Phone alerts</h2><p>Get an alert on this phone when something happens in your tables and leagues.</p><p><button class="btn" id="pushOn" type="button">Turn on phone alerts</button></p><p class="note" id="pushMsg" role="status" aria-live="polite"></p></section>' : ''}
      <section class="board"><h2 style="margin-top:0">Signing in</h2><p>There is no password. Each time you sign in we email you a one-time code, and a link that does the same thing.</p><p><button class="btn btn-alt" id="out" type="button">Sign out</button></p></section>
      <section class="board" id="delSec"><h2 style="margin-top:0">Delete your account</h2><p>This permanently deletes your account and the information tied to it. Leagues that have finished keep their results, with your seat shown as "Former manager". It cannot be undone.</p><p><button class="btn btn-alt" id="delStart" type="button" style="border-color:#9E2B22;color:#9E2B22">Delete my account</button></p><div id="delBody" role="status" aria-live="polite"></div></section>`;
    $('on').onchange = async () => { const want = $('on').checked; $('on').disabled = true; const r = await c.rpc('set_email_notices', { p: want }); $('on').disabled = false; if (r.error) { $('on').checked = !want; $('saved').style.color = '#9E2B22'; $('saved').textContent = 'We could not save that. Please try again.'; return; } $('saved').style.color = ''; $('saved').textContent = want ? 'Saved. You will get league emails.' : 'Saved. You will not get league emails.'; };
    if ($('pushOn')) $('pushOn').onclick = async () => { $('pushOn').disabled = true; const r = await window.CC_NATIVE.enablePush(); $('pushOn').disabled = false; $('pushMsg').style.color = r === 'granted' ? '' : '#9E2B22'; $('pushMsg').textContent = r === 'granted' ? 'Phone alerts are on for this phone.' : r === 'denied' ? 'Alerts are off for this app. You can turn them on in your phone\'s Settings.' : 'We could not turn alerts on. Please try again.'; };
    // ---- the avatar picker ----
    const ini = String(cc.user.email || '?').trim().charAt(0).toUpperCase() || '?', saved = prow.avatar_emoji ? { emoji: prow.avatar_emoji, color: prow.avatar_color } : null;
    let pick = saved ? { ...saved } : { emoji: '', color: '' }, base = JSON.stringify(saved || { emoji: '', color: '' });
    let editing = false;   // once an avatar is saved the picker folds away; "Change my avatar" brings it back
    const drawAv = () => {
      const hasSaved = !!JSON.parse(base).emoji; $('avPicker').hidden = hasSaved && !editing; $('avEditRow').hidden = !(hasSaved && !editing);
      const p = $('avPrev'), has = pick.emoji && pick.color; p.textContent = has ? pick.emoji : ini; p.style.background = pick.color || '#1F3F8F';
      document.querySelectorAll('.avb').forEach(b => b.setAttribute('aria-checked', String(b.dataset.emoji === pick.emoji)));
      document.querySelectorAll('.avc').forEach(b => b.setAttribute('aria-checked', String(b.dataset.color === pick.color)));
      $('avName').textContent = has ? 'Your avatar' : saved ? '' : 'The default shows the first letter of your email. Pick an emoji and a color to make your own.';
      $('avSave').disabled = !(pick.emoji && pick.color); $('avReset').disabled = !saved && !pick.emoji && !pick.color;
    };
    document.querySelectorAll('.avb').forEach(b => b.onclick = () => { pick.emoji = b.dataset.emoji; if (!pick.color) pick.color = COLORS[0][0]; $('avMsg').textContent = ''; drawAv(); });
    document.querySelectorAll('.avc').forEach(b => b.onclick = () => { pick.color = b.dataset.color; if (!pick.emoji) pick.emoji = EMOJIS[0]; $('avMsg').textContent = ''; drawAv(); });
    const sendAv = async (emoji, color) => {
      $('avSave').disabled = true; $('avReset').disabled = true; const r = await c.rpc('set_avatar', { p_emoji: emoji, p_color: color });
      if (r.error) { $('avMsg').style.color = '#9E2B22'; $('avMsg').textContent = 'We could not save that. Please try again.'; drawAv(); return; }
      const a = emoji && color ? { emoji, color } : null; try { if (a) localStorage.setItem('gts-avatar:' + cc.user.id, JSON.stringify(a)); else localStorage.removeItem('gts-avatar:' + cc.user.id); } catch (e) {}
      window.dispatchEvent(new CustomEvent('cc-avatar', { detail: a })); $('avMsg').style.color = ''; $('avMsg').textContent = a ? 'Saved. Your avatar shows at the top of every page.' : 'Back to the default.';
      base = JSON.stringify(a || { emoji: '', color: '' }); pick = a ? { ...a } : { emoji: '', color: '' }; editing = false; drawAv();
    };
    $('avSave').onclick = () => sendAv(pick.emoji, pick.color); $('avReset').onclick = () => { pick = { emoji: '', color: '' }; sendAv('', '').then(() => {}); };
    $('avEdit').onclick = () => { editing = true; $('avMsg').textContent = ''; drawAv(); };
    drawAv();
    // ---- milestone rewards: extra avatars you unlock by reaching milestones (a bonus: if they cannot load, the picker still works) ----
    (async () => { try {
      const r = await c.rpc('my_rewards'); if (r.error || !Array.isArray(r.data) || !r.data.length || !$('avRewards')) return;
      const got = r.data.filter(x => x.earned).length;
      $('avRewards').innerHTML = `<h3 class="msh" style="margin:12px 0 2px">Milestone rewards</h3><p class="note" style="margin:0 0 4px">${got} of ${r.data.length} unlocked. Reach a milestone on <a href="career.html#milestones">My record</a> to unlock its avatar.</p>
        <div role="radiogroup" aria-label="Milestone reward emoji" class="avgrid">${r.data.map(x => x.earned
          ? `<button type="button" role="radio" class="avb" data-emoji="${esc(x.emoji)}" aria-checked="false" aria-label="${esc(x.emoji)}, unlocked by: ${esc(x.label)}" title="${esc(x.label)}">${esc(x.emoji)}</button>`
          : `<button type="button" class="avb" disabled aria-label="Locked. Unlock it with: ${esc(x.label)}" title="Locked: ${esc(x.label)}" style="opacity:.4;cursor:not-allowed;font-size:20px">&#128274;</button>`).join('')}</div>`;
      $('avRewards').querySelectorAll('.avb:not([disabled])').forEach(b => b.onclick = () => { pick.emoji = b.dataset.emoji; if (!pick.color) pick.color = COLORS[0][0]; $('avMsg').textContent = ''; drawAv(); });
      drawAv();
    } catch (e) {} })();
    // ---- my invitations (a bonus: if it cannot load, the rest of the page still works) ----
    async function drawInv() { try {
      const sec = $('invSec'); if (!sec) return;
      const r = await c.rpc('my_invitations'); sec.hidden = false;
      if (r.error || !r.data) { sec.innerHTML = '<h2 style="margin-top:0">My invitations</h2><p>We could not load your invitations just now. Please refresh the page.</p>'; return; }
      const games = r.data.games || [], appr = r.data.approvals || [], wait = r.data.waiting || [], sent = r.data.sent || [], quick = r.data.quick || [], joined = r.data.joined || [], live = r.data.live || [];
      const CL = (window.PlayInvite && window.PlayInvite.CLUBS) || [];
      const club = k => { if (k === 'DRAFT') return 'a team you will draft'; const x = CL.find(y => y[0] === k); return x ? x[1] + ' ' + x[2] : k; };
      const ago = t => { const m = Math.max(0, Math.round((Date.now() - new Date(t).getTime()) / 60000)); if (!(m >= 0)) return ''; if (m < 2) return 'just now'; if (m < 60) return m + ' minutes ago'; const h = Math.round(m / 60); if (h < 48) return h + (h === 1 ? ' hour ago' : ' hours ago'); return Math.round(h / 24) + ' days ago'; };
      const base = location.origin + location.pathname.replace(/[^/]*$/, '');
      const row = 'display:flex;gap:8px;flex-wrap:wrap;margin-top:6px';
      const gl = games.map(g => g.status === 'ready'
        ? `<li><b>${esc(g.guest_name || 'Your friend')} joined your game</b><span class="note">You are playing as ${esc(club(g.team))}. Sent ${esc(ago(g.created_at))}.</span><div style="${row}"><a class="btn btn-main" href="friend.html?g=${encodeURIComponent(g.id)}">Open game</a><button class="btn btn-alt" type="button" data-icancel="${esc(g.id)}">Cancel</button></div></li>`
        : `<li><b>Waiting for your friend to open the link</b><span class="note">${g.mode === 'draft' ? 'A draft game' : 'You are playing as ' + esc(club(g.team))}. Sent ${esc(ago(g.created_at))}.</span><div style="${row}"><button class="btn btn-main" type="button" data-icopy="${esc(g.code)}">Copy the link</button><a class="btn btn-alt" href="friend.html?g=${encodeURIComponent(g.id)}">Open</a><button class="btn btn-alt" type="button" data-icancel="${esc(g.id)}">Cancel</button></div></li>`).join('');
      const al = appr.map(a => `<li><b>${a.n === 1 ? '1 person is' : a.n + ' people are'} waiting for your approval</b><span class="note">${esc(a.name)}</span><div style="${row}"><a class="btn btn-main" href="private.html">Review</a></div></li>`).join('');
      const wl = wait.map(w => `<li><b>Waiting for the commissioner</b><span class="note">Your request to join ${esc(w.name)} as ${esc(w.club_name)}. Sent ${esc(ago(w.created_at))}.</span></li>`).join('');
      const HOW = { email_app: 'Opened in your email app', email_copy: 'Email copied', text_copy: 'Text message copied', link_copy: 'Link copied', link_share: 'Shared from your phone' };
      const QS = { pending: 'waiting for an answer', accepted: 'said yes', declined: 'said not now', expired: 'did not answer in time', cancelled: 'you canceled it' };
      const sl = sent.map(x => `<li><b>${x.label ? esc(x.label) : 'No name given'}</b><span class="note">${esc(HOW[x.method] || x.method)} &middot; ${x.kind === 'league' ? 'for ' + esc(x.league_name || 'your league') : 'for a friend game'} &middot; ${esc(ago(x.created_at))}</span></li>`).join('');
      const ql = quick.map(x => `<li><b>${esc(x.name)}</b><span class="note">Quick invite to play &middot; ${esc(QS[x.status] || x.status)} &middot; ${esc(ago(x.created_at))}</span></li>`).join('');
      const jl = joined.map(x => `<li><b>You said yes to ${esc(x.host_name)}</b><span class="note">${x.mode === 'draft' ? 'A draft game' : 'You are playing as ' + esc(club(x.team))}. Waiting for someone to tap Play ball. Sent ${esc(ago(x.created_at))}.</span><div style="${row}"><a class="btn btn-main" href="friend.html?g=${encodeURIComponent(x.id)}">Open game</a></div></li>`).join('');
      const ll = live.map(x => `<li><b>Game in progress against ${esc(x.opp_name)}</b><span class="note">Started ${esc(ago(x.started_at))}. If you are away, the computer makes your calls, and you can jump back in any time.</span><div style="${row}"><a class="btn btn-main" href="friend-play.html?g=${encodeURIComponent(x.id)}">Jump back in</a></div></li>`).join('');
      const grp = (title, html) => html ? `<h3 style="margin:14px 0 6px;font-size:16px">${title}</h3><ul class="acl">${html}</ul>` : '';
      const any = games.length || appr.length || wait.length || sent.length || quick.length || joined.length || live.length;
      sec.innerHTML = `<h2 style="margin-top:0">My invitations</h2>${any ? `${grp('Games in progress', ll)}${grp('Games you said yes to', jl)}${grp('Games waiting on a friend', gl)}${grp('Waiting for your approval', al)}${grp('Your requests to join', wl)}${grp('Invites you sent', sl)}${grp('Quick invites, last 24 hours', ql)}` : '<p>No invitations are waiting right now.</p>'}
        <p class="note" style="margin-top:12px">Names show only if you typed one in the box next to the invite. We note which button you used, not whether you actually sent it, because we can not see your email or texts. Invites you sent stay here for up to 14 days. A quick invite to someone who is online lasts about a minute and also shows at the bottom of your screen.</p>
        <p id="invMsg" class="note" role="status" aria-live="polite"></p>`;
      sec.querySelectorAll('[data-icopy]').forEach(b => b.onclick = async () => {
        const link = base + 'friend.html?join=' + encodeURIComponent(b.dataset.icopy);
        try { await navigator.clipboard.writeText(link); $('invMsg').textContent = 'Link copied. Send it to your friend.'; } catch (e) { window.prompt('Copy this link and send it to your friend:', link); }
      });
      sec.querySelectorAll('[data-icancel]').forEach(b => b.onclick = async () => {
        if (!confirm('Cancel this game? The link will stop working.')) return;
        b.disabled = true; const x = await c.rpc('cancel_friend_game', { p_id: b.dataset.icancel });
        if (x.error) { b.disabled = false; $('invMsg').textContent = 'We could not cancel that. Please try again.'; return; }
        drawInv();
      });
    } catch (e) {} }
    drawInv();
    // ---- keychain reward (a bonus: it only shows for someone who has earned it) ----
    (async () => { try {
      const sec = $('kcSec'), r = await c.rpc('my_keychain'); if (!sec || r.error || !r.data || r.data.state === 'none') return;
      const WHY = { commissioner: 'You ran a private league all the way to the end.', champion: 'You won a private league championship.' };
      if (r.data.state === 'claimed') { const S = { new: 'We have your address and will order it soon.', ordered: 'It has been ordered.', shipped: 'It is on its way.', canceled: 'This claim was canceled. Please contact us.' }; sec.innerHTML = `<h2 style="margin-top:0">Your keychain</h2><p>${esc(S[r.data.status] || 'Claimed.')}</p>`; sec.hidden = false; return; }
      const fld = (id, label, ac, extra) => `<p style="margin:6px 0"><label for="${id}" style="display:block;font-weight:600">${label}</label><input id="${id}" type="text" autocomplete="${ac}" ${extra || ''} style="width:100%;box-sizing:border-box;min-height:44px;font:inherit;padding:8px 10px;border:1.5px solid #8C959E;border-radius:4px"></p>`;
      sec.innerHTML = `<h2 style="margin-top:0">Your keychain</h2><p>${esc(WHY[r.data.reason] || '')} We will mail you a free Cooperstown Cash keychain. US addresses only, one per person.</p>
        <div id="kcForm">${fld('kcName', 'Name', 'name')}${fld('kcL1', 'Street address', 'address-line1')}${fld('kcL2', 'Apartment or unit (if any)', 'address-line2')}${fld('kcCity', 'City', 'address-level2')}${fld('kcSt', 'State (2 letters)', 'address-level1', 'maxlength="2" autocapitalize="characters"')}${fld('kcZip', 'ZIP code', 'postal-code', 'inputmode="numeric" maxlength="10"')}
        <p class="note">We use your address only to mail the keychain, and we do not share it with anyone but the company that makes and ships it.</p>
        <p><button class="btn btn-main" id="kcSend" type="button">Send my keychain</button></p><p class="note" id="kcMsg" role="alert" aria-live="polite"></p></div>`;
      sec.hidden = false;
      $('kcSend').onclick = async () => {
        $('kcSend').disabled = true; $('kcMsg').style.color = ''; $('kcMsg').textContent = 'Sending…';
        const g = id => $(id).value, q = await c.rpc('claim_keychain', { p_name: g('kcName'), p_line1: g('kcL1'), p_line2: g('kcL2'), p_city: g('kcCity'), p_state: g('kcSt'), p_zip: g('kcZip') });
        if (q.error) { $('kcSend').disabled = false; $('kcMsg').style.color = '#9E2B22'; $('kcMsg').textContent = q.error.message || 'We could not save that. Please try again.'; return; }
        sec.innerHTML = '<h2 style="margin-top:0">Your keychain</h2><p>Thank you. We have your address and will order it soon.</p>';
      };
    } catch (e) {} })();
    // ---- charts under "Your record" (a bonus: if they cannot load, the rest of the page still works) ----
    (async () => { try {
      if (!window.CCCharts || !$('acCharts')) return;
      const [a, b] = await Promise.all([c.rpc('my_career'), c.rpc('my_stats')]);
      if (a.error || !a.data) return;
      $('acCharts').innerHTML = CCCharts.html(a.data, b.error ? null : b.data); CCCharts.wire($('acCharts'));
    } catch (e) {} })();
    // ---- delete my account ----
    const delBody = $('delBody'), delStart = $('delStart');
    delStart.onclick = async () => {
      delStart.disabled = true; delBody.innerHTML = '<p>Checking…</p>';
      const r = await c.rpc('delete_my_account', { p_confirm: false }); delStart.disabled = false;
      if (r.error || !r.data) { delBody.innerHTML = '<p class="note" style="color:#9E2B22">We could not check your account right now. Please try again.</p>'; return; }
      if (!r.data.ok) {
        delBody.innerHTML = '<p><b>We can\'t delete your account yet.</b></p><ul>' + (r.data.blockers || []).map(x => '<li>' + esc(x.league ? x.league + ': ' : '') + esc(x.why) + '</li>').join('') + '</ul><p class="note">Once that is sorted, come back here.</p>'; return;
      }
      delBody.innerHTML = '<p><b>This is permanent.</b> Type <b>DELETE</b> to confirm.</p><input id="delType" type="text" autocomplete="off" autocapitalize="characters" aria-label="Type DELETE to confirm" style="width:100%;box-sizing:border-box;min-height:44px;padding:8px 10px;margin:6px 0;font:inherit;border:1.5px solid #8C959E;border-radius:4px"><p style="display:flex;gap:10px;flex-wrap:wrap;margin:8px 0"><button class="btn" id="delGo" type="button" disabled style="background:#9E2B22;border-color:#9E2B22;color:#fff">Yes, delete my account forever</button><button class="btn btn-alt" id="delNo" type="button">Keep my account</button></p><p class="note" id="delMsg"></p>';
      $('delType').oninput = () => { $('delGo').disabled = $('delType').value.trim().toUpperCase() !== 'DELETE'; };
      $('delNo').onclick = () => { delBody.innerHTML = ''; };
      $('delGo').onclick = async () => {
        $('delGo').disabled = true; $('delNo').disabled = true; $('delType').disabled = true; $('delMsg').textContent = 'Deleting…';
        const d = await c.rpc('delete_my_account', { p_confirm: true });
        if (d.error || !d.data || !d.data.deleted) { $('delMsg').style.color = '#9E2B22'; $('delMsg').textContent = 'We could not delete your account. Nothing was changed. Please try again.'; $('delNo').disabled = false; $('delType').disabled = false; return; }
        try { localStorage.clear(); } catch (e) {}
        try { await c.auth.signOut(); } catch (e) {}
        box.innerHTML = '<section class="board"><h2 style="margin-top:0">Your account is deleted</h2><p>Thank you for playing. You can start fresh any time.</p><p><a class="btn" href="index.html">Go to the home page</a></p></section>';
        $('who').textContent = '';
      };
    };
    $('out').onclick = async () => { $('out').disabled = true; const bar = document.getElementById('accOut'); if (bar) bar.click(); else await c.auth.signOut(); };   // the bar's button also saves your progress first
  }
  window.addEventListener('cc-auth', paint);
  (window.CC ? window.CC.whenReady.bind(window.CC) : fn => fn())(paint);
})();
</script>
<style>.avrow { display: flex; align-items: center; gap: 12px; margin: 4px 0 10px; } .av.big { width: 64px; height: 64px; font-size: 36px; } .av { display: inline-flex; align-items: center; justify-content: center; border-radius: 50%; color: #fff; font-weight: 700; border: 3px solid #fff; box-shadow: 0 1px 4px rgba(0,0,0,.35); flex: none; }
.avgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(48px, 1fr)); gap: 6px; margin: 6px 0; } .avb { min-width: 44px; min-height: 48px; font-size: 26px; line-height: 1; background: #fff; border: 2px solid #D9DDE2; border-radius: 8px; cursor: pointer; } .avb[aria-checked="true"] { border-color: #1F3F8F; background: #E6ECFA; }
.avcols { display: flex; flex-wrap: wrap; gap: 8px; margin: 10px 0; } .avc { width: 44px; height: 44px; border-radius: 50%; border: 3px solid #fff; box-shadow: 0 0 0 1px #8C959E; cursor: pointer; } .avc[aria-checked="true"] { box-shadow: 0 0 0 3px #1F3F8F; } .avact { display: flex; flex-wrap: wrap; gap: 10px; margin: 8px 0; } .avb:focus-visible, .avc:focus-visible { outline: 3px solid #E0A81E; outline-offset: 2px; }
.acl { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; } .acl li { display: flex; flex-direction: column; gap: 2px; padding: 10px 12px; border: 1px solid #D9DDE2; border-radius: 6px; background: #fff; } .acl a { min-height: 24px; }</style>
</body>
