<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">

<title>Cooperstown Cash: Game</title>

<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Condensed:wght@400;500;600&family=Permanent+Marker&display=swap" rel="stylesheet">
<style>
:root {
  --marker: 'Permanent Marker', 'Comic Sans MS', 'Chalkboard SE', cursive;
  --text: 'IBM Plex Sans Condensed', 'Arial Narrow', 'Helvetica Neue', Arial, sans-serif;
  --wall: #CED2CF; --ink: #19231E; --ink-soft: #4A5560; --wb: #F7F8F6; --wb-ink: #1F3F8F; --wb-red: #C0392B; --wb-green: #1E7B45; --wb-frame: #B7BDC2; --lamp: #F2B33D;
  box-sizing: border-box; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --wall: #1C201E; --ink: #E4E8E0; --ink-soft: #A9B4AD; } }
:root[data-theme="dark"] { --wall: #1C201E; --ink: #E4E8E0; --ink-soft: #A9B4AD; }
html { scroll-padding-top: env(safe-area-inset-top, 0px); }
*, *::before, *::after { box-sizing: inherit; }
[hidden] { display: none !important; }
body { margin: 0; background: var(--wall); color: var(--ink); font: 16px/1.5 var(--text); }
button { font: inherit; }
:focus-visible { outline: 3px solid var(--lamp); outline-offset: 2px; }
.wrap { max-width: 1000px; margin: 0 auto; padding: 18px 16px 60px; }
.crumbs { margin: 0 0 10px; font-size: 14px; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.crumbs a { color: var(--ink); font-weight: 600; }
.crumbs .badge { width: 52px; height: 52px; display: block; } .crumbs .badge img { width: 100%; height: 100%; }
.wb { background: var(--wb); color: #20262D; border-radius: 4px; box-shadow: inset 0 0 0 8px var(--wb-frame), 0 3px 0 rgba(0,0,0,.18); padding: 20px 28px; }
.wb h1 { font: 400 clamp(26px, 5vw, 40px)/1.05 var(--marker); color: var(--wb-ink); margin: 0 0 4px; }
.wb p { margin: 0 0 6px; color: #3A434D; max-width: 74ch; }
.card { background: var(--wb); color: #20262D; border-radius: 4px; box-shadow: inset 0 0 0 6px var(--wb-frame), 0 2px 0 rgba(0,0,0,.18); padding: 18px 22px; margin-top: 18px; }
.card h2 { font: 400 24px/1.1 var(--marker); color: var(--wb-ink); margin: 0 0 8px; }
.note { font-size: 14px; color: #4A5560; }
.btn { border: 0; border-radius: 4px; padding: 10px 20px; font-weight: 600; cursor: pointer; min-height: 46px; text-decoration: none; display: inline-block; background: var(--wb-ink); color: #fff; }
.btn:hover { background: #17306E; } .btn.alt { background: transparent; color: #20262D; border: 1.5px solid #8C959E; } .btn.alt:hover { background: #E9ECEA; }
.btn.big { font-size: 20px; padding: 12px 30px; min-height: 54px; }
.btn[disabled] { opacity: .5; cursor: default; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-top: 12px; }
.msg { font-weight: 600; margin: 10px 0 0; } .msg.err { color: var(--wb-red); } .msg.ok { color: var(--wb-green); }
/* line score */
.ls { width: 100%; border-collapse: collapse; font-size: 16px; text-align: center; }
.ls th { font-size: 12.5px; text-transform: uppercase; letter-spacing: .05em; color: #4A5560; padding: 6px 4px; border-bottom: 2px solid #DDE1E4; }
.ls td { padding: 8px 4px; border-top: 1px solid #ECEEF0; min-width: 26px; }
.ls td.team, .ls th.team { text-align: left; font-weight: 600; white-space: nowrap; padding-right: 12px; }
.ls td.now { background: #FFF3A0; box-shadow: inset 0 0 0 2px #E1B62E; }
.ls td.tot { font-weight: 700; border-left: 2px solid #DDE1E4; } .ls tr.me td.team { color: var(--wb-ink); }
.scroll { overflow-x: auto; }
/* situation and dice */
.sit { display: grid; grid-template-columns: auto 1fr; gap: 6px 22px; align-items: center; }
.diamond { width: 92px; height: 92px; }
.diamond rect { fill: #E5E8EA; stroke: #8C959E; stroke-width: 2; } .diamond rect.on { fill: #F2B33D; stroke: #B27C0A; }
.sit .where { font: 400 24px/1.1 var(--marker); color: var(--wb-ink); margin: 0; }
.sit p { margin: 2px 0 0; }
.dice { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; margin-top: 16px; }
.die { border: 2px solid #C7CDD2; border-radius: 10px; text-align: center; padding: 8px 4px 10px; background: #fff; }
.die small { display: block; font-size: 12.5px; color: #4A5560; font-weight: 600; }
.die b { display: block; font: 400 44px/1.1 var(--marker); color: #8A939C; } .die.win { border-color: var(--wb-green); background: #F1F9F3; } .die.win b { color: var(--wb-green); }
.die.spin b { color: var(--wb-ink); } .die.pct b { font-size: 40px; } .die.set b { color: var(--wb-ink); }
.dnote { min-height: 2.8em; margin: 10px 0 0; font-weight: 600; }
.result { font: 400 26px/1.2 var(--marker); color: var(--wb-red); margin: 6px 0 0; min-height: 1.3em; }
.hr { margin-top: 12px; }
/* feed */
.feed { list-style: none; margin: 0; padding: 0; }
.feed .inn { font: 400 18px var(--marker); color: var(--wb-red); margin: 14px 0 4px; }
.feed li.p { padding: 7px 4px; border-bottom: 1px solid #E8EBED; }
.feed li.p b { font-weight: 600; } .feed .d { display: block; font-size: 12.5px; color: #6B747D; }
.feed li.hr b { color: var(--wb-red); } .feed li.chg { color: #4A5560; font-style: italic; padding: 5px 4px; }
.final { text-align: center; }
.final .big-score { font: 400 clamp(30px, 6vw, 46px)/1.1 var(--marker); color: var(--wb-ink); margin: 0 0 4px; }
table.box { width: 100%; border-collapse: collapse; font-size: 14.5px; margin: 6px 0 14px; }
table.box th { text-align: left; font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: #4A5560; padding: 6px 6px; border-bottom: 2px solid #DDE1E4; }
table.box td { padding: 5px 6px; border-top: 1px solid #ECEEF0; } table.box td.n, table.box th.n { text-align: right; white-space: nowrap; } table.box tr.tot td { font-weight: 700; border-top: 2px solid #DDE1E4; }
h3.tm { font: 400 19px var(--marker); color: var(--wb-ink); margin: 14px 0 0; }
footer { margin-top: 26px; font-size: 13px; color: var(--ink-soft); max-width: 80ch; }
@media (max-width: 640px) { .wb { padding: 16px 18px; } .card { padding: 14px 14px; } .die b { font-size: 34px; } .die small { font-size: 11.5px; } .sit { grid-template-columns: 1fr; } .hide-sm { display: none; } }
</style>
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<script src="vendor/supabase-2.117.2.js"></script>
<script src="cloud.js"></script>
<script src="fx.js"></script>
</head>
<body>
<div class="wrap">
  <nav class="crumbs"><a class="badge" href="index.html"><img src="logo.webp" alt="Cooperstown Cash home" width="52" height="52"></a><a href="index.html">Home</a> <span aria-hidden="true">/</span> <a href="private.html">Private leagues</a> <span aria-hidden="true">/</span> <a href="private.html" id="backSeason">Season</a></nav>
  <header class="wb"><h1 id="title">Game</h1><p id="sub">Loading…</p></header>
  <main id="main"></main>
  <footer><p>Prototype for testing. The server rolls every die, so nobody can steer a roll. Each game is played once, and it's the same game for both managers.</p></footer>
</div>
<script>
(() => {
  const $ = id => document.getElementById(id);
  const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const sleep = ms => new Promise(r => setTimeout(r, ms));
  const fmt = t => new Date(t).toLocaleString([], { weekday: 'short', month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' });
  const ord = n => n + (['th', 'st', 'nd', 'rd'][(n % 100 - 20) % 10] || ['th', 'st', 'nd', 'rd'][n % 100] || 'th');
  const HIT = new Set(['S', '2B', '3B', 'HR']);
  const S = { id: Number(new URLSearchParams(location.search).get('g')), game: null, mySeat: null, board: [], log: null, result: null, idx: 0, mode: 'loading', starter: false, busy: false, animating: false, dice: null, msg: '', finishing: false, finishErr: '', triedOverdue: false, reduce: !!(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches) };
  const client = () => window.CC && window.CC.client;
  const name = seat => (S.board.find(b => b.seat_no === seat) || {}).club_name || 'Club ' + seat;
  const key = () => 'cc-rv-' + S.id + '-' + ((window.CC && window.CC.user && window.CC.user.id) || 'x');
  const saveIdx = () => { try { localStorage.setItem(key(), String(S.idx)); } catch (e) {} };
  const loadIdx = () => { try { return Math.max(0, Number(localStorage.getItem(key())) || 0); } catch (e) { return 0; } };
  const clearIdx = () => { try { localStorage.removeItem(key()); } catch (e) {} };
  async function errText(error, data) {
    if (data && data.error) return data.error;
    try { if (error && error.context && typeof error.context.json === 'function') { const j = await error.context.json(); if (j && j.error) return j.error; } } catch (e) {}
    return 'Something went wrong. Please try again.';
  }

  // ---------- loading ----------
  async function load() {
    const c = client();
    if (!S.id) { setMsg('That game link isn\'t valid.'); return; }
    if (!c || !window.CC.user) { $('sub').textContent = 'Sign in to see this game.'; if (c) window.CC.requireSignIn('Sign in to see your game'); return; }
    try {
      const gm = await c.from('games').select('id,league_id,day,seq,away_seat,home_seat,opens_at,deadline_at,status,away_runs,home_runs,round,game_no').eq('id', S.id);
      S.game = gm.data && gm.data[0]; if (!S.game) { setMsg('We couldn\'t find that game, or you\'re not in that league.'); return; }
      const [seats, board, lg] = await Promise.all([c.from('seats').select('league_id,seat_no'), c.from('seat_board').select('seat_no,club_name').eq('league_id', S.game.league_id), c.from('game_logs').select('log,result,final').eq('game_id', S.id)]);
      const mine = (seats.data || []).find(s => s.league_id === S.game.league_id); S.mySeat = mine ? mine.seat_no : null; S.board = board.data || [];
      $('backSeason').href = 'season.html?league=' + S.game.league_id;
      const g = S.game, row = lg.data && lg.data[0], isMine = S.mySeat === g.away_seat || S.mySeat === g.home_seat, now = Date.now();
      $('title').textContent = `${name(g.away_seat)} at ${name(g.home_seat)}`;
      S.log = null; S.result = null; S.starter = false;
      if (g.status === 'final') {
        if (row) { S.log = row.log; S.result = row.result; S.idx = S.log.length; S.mode = 'final'; } else { S.mode = 'msg'; S.msg = `Final: ${name(g.away_seat)} ${g.away_runs}, ${name(g.home_seat)} ${g.home_runs}.`; }
      } else if (g.status === 'in_progress') {
        if (row && !row.final) { S.log = row.log; S.result = row.result; S.starter = true; S.idx = Math.min(loadIdx(), S.log.length); S.mode = 'playing'; }
        else { S.mode = 'msg'; S.msg = 'The other manager is playing this game right now. The result shows up here when they finish, or at the deadline.'; }
      } else if (now > new Date(g.deadline_at)) {
        S.mode = 'msg'; S.msg = 'The deadline for this game has passed. The server plays overdue games automatically.';
        if (!S.triedOverdue && c.functions) { S.triedOverdue = true; c.functions.invoke('game-sim', { body: { action: 'finish-overdue', league_id: g.league_id } }).then(r => { if (r && r.data && r.data.finished > 0) load(); }).catch(() => {}); }
      } else if (!isMine) { S.mode = 'msg'; S.msg = 'This game hasn\'t been played yet. Only the two managers in it can play it.'; }
      else if (now < new Date(g.opens_at)) { S.mode = 'msg'; S.msg = 'This game day opens ' + fmt(g.opens_at) + '.'; }
      else S.mode = 'ready';
      render();
      if (S.mode === 'playing' && S.idx >= S.log.length) finish();
    } catch (e) { setMsg('We couldn\'t load this game. Please refresh the page.'); }
  }
  function setMsg(t) { S.mode = 'msg'; S.msg = t; render(); }

  // ---------- starting ----------
  async function start(action) {
    if (S.busy) return; S.busy = true; S.msg = ''; render();
    const { data, error } = await client().functions.invoke('game-sim', { body: { action, game_id: S.id } });
    S.busy = false;
    if (error || !data || data.error) { S.msg = await errText(error, data); render(); return; }
    if (data.status === 'final') { load(); return; }               // it was simmed, so it's official already
    S.log = data.log; S.result = data.result; S.starter = true; S.idx = 0; saveIdx(); S.game.status = 'in_progress'; S.mode = 'playing'; render();
  }

  // ---------- rolling ----------
  function cardNote(p) { return `${p.owner === 'batter' ? p.batter : p.pitcher}'s card. A ${p.roll} falls in ${p.lo} to ${p.hi}: ${p.label}.`; }
  async function animateDice(p, quick) {
    S.animating = true; updateControls();
    const d = S.dice = { bat: null, pit: null, roll: null, winner: null, note: '', spin: [] };
    const show = () => { updateDice(); };
    if (S.reduce) { Object.assign(d, { bat: p.bat, pit: p.pit, roll: p.roll, winner: p.owner, note: cardNote(p) }); show(); S.animating = false; return; }
    const tumble = async (keys, ms) => { d.spin = keys; const end = Date.now() + ms; while (Date.now() < end) { keys.forEach(k => { d[k] = k === 'roll' ? 1 + Math.floor(Math.random() * 100) : 1 + Math.floor(Math.random() * 20); }); show(); await sleep(55); } d.spin = []; };
    d.note = 'Rolling the duel dice…'; await tumble(['bat', 'pit'], quick ? 200 : 550);
    d.bat = p.bat; d.pit = p.pit; d.winner = p.owner; d.note = `${p.bat} to ${p.pit}. The higher die wins, so this play is read from ${p.owner === 'batter' ? p.batter : p.pitcher}'s card.`; show(); await sleep(quick ? 150 : 450);
    d.note = 'Rolling for the result…'; show(); await tumble(['roll'], quick ? 200 : 550);
    d.roll = p.roll; d.note = cardNote(p); show(); await sleep(quick ? 100 : 300);
    S.animating = false;
  }
  function reveal(n) {
    for (let k = 0; k < n && S.idx < S.log.length; k++) { const p = S.log[S.idx++]; if (p.code === 'HR' && window.FX) window.FX.homeRun({ text: p.txt, runs: p.scored, walkOff: !!p.walkOff }); }
    saveIdx(); updateAll(); if (S.idx >= S.log.length) finish();
  }
  async function rollNext() { if (S.busy || S.animating || S.idx >= S.log.length) return; S.busy = true; await animateDice(S.log[S.idx]); S.busy = false; reveal(1); }
  async function playHalf() {
    if (S.busy || S.animating || S.idx >= S.log.length) return; S.busy = true; const f = S.log[S.idx];
    while (S.idx < S.log.length && S.log[S.idx].half === f.half && S.log[S.idx].inning === f.inning) { await animateDice(S.log[S.idx], true); reveal(1); await sleep(S.reduce ? 0 : 200); }
    S.busy = false; updateControls();
  }
  function skipAll() { if (S.busy || S.animating || S.idx >= S.log.length) return; const last = S.log[S.log.length - 1]; S.dice = { bat: last.bat, pit: last.pit, roll: last.roll, winner: last.owner, note: cardNote(last), spin: [] }; reveal(S.log.length - S.idx); }
  async function finish() {
    if (S.finishing || S.game.status === 'final') { updateAll(); return; } S.finishing = true; S.finishErr = ''; updateFinal();
    if (S.starter && S.game.status === 'in_progress') {
      const { data, error } = await client().rpc('finish_game', { p_game_id: S.id });
      if (error) { S.finishErr = error.message || 'We couldn\'t record the result.'; S.finishing = false; updateFinal(); return; }
      S.game.status = 'final'; S.game.away_runs = data.away_runs; S.game.home_runs = data.home_runs; clearIdx();
    }
    S.finishing = false; updateFinal(); updateControls();
  }

  // ---------- drawing ----------
  function render() {
    const g = S.game; const sub = $('sub');
    if (g) sub.textContent = (g.round && g.round !== 'regular' ? `${g.round === 'final' ? 'The final' : 'Semifinal'}, game ${g.game_no}.` : `Game day ${g.day} of 27.`) + (S.mode === 'ready' ? ` Open until ${fmt(g.deadline_at)}.` : '');
    else if (S.mode === 'msg') sub.textContent = '';
    const m = $('main');
    if (S.mode === 'msg') { m.innerHTML = `<section class="card"><p>${esc(S.msg)}</p><div class="row"><a class="btn alt" href="${g ? 'season.html?league=' + g.league_id : 'private.html'}">Back to the season</a></div></section>`; return; }
    if (S.mode === 'ready') {
      m.innerHTML = `<section class="card"><h2>Ready to play?</h2><p>You and your opponent are playing the same game, and the server rolls every die. Play it yourself and roll each at-bat, or sim it now. Either way the result is final, and if you don't finish by ${esc(fmt(g.deadline_at))} the server plays it out for you.</p>
        <div class="row"><button class="btn big" id="goPlay" ${S.busy ? 'disabled' : ''}>${S.busy ? 'Setting up…' : 'Play it: roll every at-bat'}</button><button class="btn alt" id="goSim" ${S.busy ? 'disabled' : ''}>Sim it now</button></div><p class="msg err" id="startMsg" role="alert">${esc(S.msg)}</p></section>`;
      $('goPlay').onclick = () => start('play'); $('goSim').onclick = () => { if (confirm('Sim this game now? The server rolls every at-bat and the result is final.')) start('sim'); };
      return;
    }
    // playing or final: the board, the roll area, the feed, and the box score
    m.innerHTML = `<section class="card"><div class="scroll" id="sb"></div></section>
      <section class="card" id="rollcard"><div class="sit" id="sit"></div>
        <div class="dice" id="dice" aria-live="polite"></div><p class="dnote" id="dnote"></p><p class="result" id="result"></p>
        <div class="row" id="ctl"></div></section>
      <section class="card"><h2>Play by play</h2><ul class="feed" id="feed"></ul></section><section class="card final" id="fin" hidden></section>`;
    updateAll();
  }
  function updateAll() { updateBoard(); updateSituation(); updateDice(); updateControls(); updateFeed(); updateFinal(); const rc = $('rollcard'); if (rc) rc.hidden = S.idx >= S.log.length && !S.dice; }

  function lineScore() {
    const shown = S.log.slice(0, S.idx), done = S.idx >= S.log.length;
    if (done) return { rows: S.result.line.map(r => r.slice()), hits: S.result.hits, errors: S.result.errors, runs: [S.result.away_runs, S.result.home_runs] };
    const n = Math.max(9, ...shown.map(p => p.inning), (S.log[S.idx] || {}).inning || 9), rows = [Array(n).fill(null), Array(n).fill(null)], hits = [0, 0], errors = [0, 0];
    shown.forEach(p => { rows[p.half][p.inning - 1] = (rows[p.half][p.inning - 1] || 0) + p.scored; if (HIT.has(p.code)) hits[p.half]++; if (p.code === 'E') errors[1 - p.half]++; });
    return { rows, hits, errors, runs: rows.map(r => r.reduce((s, x) => s + (x || 0), 0)) };
  }
  function updateBoard() {
    const ls = lineScore(), n = ls.rows[0].length, g = S.game, next = S.log[S.idx];
    const head = `<tr><th class="team">Club</th>${Array.from({ length: n }, (_, i) => `<th>${i + 1}</th>`).join('')}<th>R</th><th>H</th><th>E</th></tr>`;
    const body = [0, 1].map(h => `<tr class="${S.mySeat === (h ? g.home_seat : g.away_seat) ? 'me' : ''}"><td class="team">${esc(name(h ? g.home_seat : g.away_seat))}</td>${ls.rows[h].map((v, i) => `<td class="${next && next.half === h && next.inning === i + 1 ? 'now' : ''}">${v == null ? '' : v}</td>`).join('')}<td class="tot">${ls.runs[h]}</td><td>${ls.hits[h]}</td><td>${ls.errors[h]}</td></tr>`).join('');
    $('sb').innerHTML = `<table class="ls" aria-label="Line score"><thead>${head}</thead><tbody>${body}</tbody></table>`;
  }
  function updateSituation() {
    const g = S.game, nx = S.log[S.idx], pv = S.log[S.idx - 1], el = $('sit');
    if (!nx) { el.innerHTML = '<div><p class="where">Game over</p></div>'; return; }
    const same = pv && pv.half === nx.half && pv.inning === nx.inning && pv.outs < 3, outs = same ? pv.outs : 0, run = same ? pv.runners : [null, null, null];
    const b = (i, x, y) => `<rect x="${x}" y="${y}" width="14" height="14" transform="rotate(45 ${x + 7} ${y + 7})" class="${run[i] ? 'on' : ''}"/>`;
    el.innerHTML = `<svg class="diamond" viewBox="0 0 92 92" role="img" aria-label="Runners on base: ${run.map((r, i) => r ? ['first', 'second', 'third'][i] + ' ' + r : '').filter(Boolean).join(', ') || 'none'}">${b(1, 39, 8)}${b(0, 68, 37)}${b(2, 10, 37)}<rect x="39" y="66" width="14" height="14" transform="rotate(45 46 73)" style="fill:#fff"/></svg>
      <div><p class="where">${nx.half ? 'Bottom' : 'Top'} of the ${ord(nx.inning)}, ${outs} out${outs === 1 ? '' : 's'}</p><p><b>${esc(nx.batter)}</b> (${esc(name(nx.half ? g.home_seat : g.away_seat))}) is up against <b>${esc(nx.pitcher)}</b>.</p>${run.some(Boolean) ? `<p class="note">Runners: ${run.map((r, i) => r ? ['1st', '2nd', '3rd'][i] + ' ' + esc(r) : '').filter(Boolean).join(', ')}</p>` : ''}</div>`;
  }
  function updateDice() {
    const d = S.dice, lp = S.log[S.idx - 1], g = S.game; const el = $('dice'); if (!el) return;
    const cell = (label, v, cls, extra) => `<div class="die ${cls}${v != null ? ' set' : ''}"><small>${label}</small><b>${v == null ? '–' : v}</b></div>`;
    const spin = k => d && d.spin && d.spin.includes(k) ? ' spin' : '';
    const nx = S.log[S.idx], batSide = nx ? name(nx.half ? g.home_seat : g.away_seat) : 'Batting side', pitSide = nx ? name(nx.half ? g.away_seat : g.home_seat) : 'Pitching side';
    el.innerHTML = cell(`${esc(batSide)}'s d20`, d ? d.bat : null, (d && d.winner === 'batter' && !(d.spin && d.spin.length) ? 'win' : '') + spin('bat')) + cell(`${esc(pitSide)}'s d20`, d ? d.pit : null, (d && d.winner === 'pitcher' && !(d.spin && d.spin.length) ? 'win' : '') + spin('pit')) + cell('Percentile roll', d ? d.roll : null, 'pct' + spin('roll'));
    $('dnote').textContent = d ? d.note : (S.idx < S.log.length ? 'Each side rolls a 20-sided die. The higher roll decides whose card is read. Then a 1 to 100 roll picks the result.' : '');
    $('result').textContent = lp && (!d || !S.animating) && S.idx > 0 && d ? lp.txt : '';
  }
  function updateControls() {
    const el = $('ctl'); if (!el) return; const left = S.log.length - S.idx, off = S.busy || S.animating;
    el.innerHTML = left > 0 ? `<button class="btn big" id="bRoll" ${off ? 'disabled' : ''}>Roll the dice</button><button class="btn alt" id="bHalf" ${off ? 'disabled' : ''}>Play out this half-inning</button><button class="btn alt" id="bSkip" ${off ? 'disabled' : ''}>Skip to the final</button>` : '';
    if (left > 0) { $('bRoll').onclick = rollNext; $('bHalf').onclick = playHalf; $('bSkip').onclick = skipAll; }
  }
  function updateFeed() {
    const el = $('feed'); if (!el) return; let html = '', last = '';
    for (let i = S.idx - 1; i >= 0; i--) {
      const p = S.log[i], k = p.inning + '-' + p.half, nextKey = i > 0 ? S.log[i - 1].inning + '-' + S.log[i - 1].half : null;
      html += `<li class="p${p.code === 'HR' ? ' hr' : ''}"><b>${esc(p.txt)}</b>${p.scored ? ` <span class="note">Score: ${esc(name(S.game.away_seat))} ${p.score[0]}, ${esc(name(S.game.home_seat))} ${p.score[1]}.</span>` : ''}<span class="d">${esc(p.batter)} d20 ${p.bat}, ${esc(p.pitcher)} d20 ${p.pit}, ${p.owner === 'batter' ? 'batter' : 'pitcher'}'s card, roll ${p.roll}</span></li>`;
      (p.pre || []).slice().reverse().forEach(x => { html += `<li class="chg">${esc(x.txt)}</li>`; });
      if (nextKey !== k) html += `<li class="inn">${p.half ? 'Bottom' : 'Top'} of the ${ord(p.inning)}</li>`;
    }
    el.innerHTML = html || '<li class="note">Nothing yet. Roll the first at-bat.</li>';
  }
  const ipText = r => r.IP;
  function boxTable(t, i) {
    const R = S.result, bat = R.batting[i], pit = R.pitching[i], sum = k => bat.reduce((s, x) => s + x[k], 0);
    return `<h3 class="tm">${esc(R.names[i])}</h3><div class="scroll"><table class="box"><thead><tr><th>Batter</th><th class="n">AB</th><th class="n">R</th><th class="n">H</th><th class="n">RBI</th><th class="n">BB</th><th class="n">SO</th><th class="n">HR</th></tr></thead><tbody>${bat.map(x => `<tr><td>${esc(x.name)} <span class="note">${esc((x.pos || '').toUpperCase())}</span></td><td class="n">${x.AB}</td><td class="n">${x.R}</td><td class="n">${x.H}</td><td class="n">${x.RBI}</td><td class="n">${x.BB}</td><td class="n">${x.SO}</td><td class="n">${x.HR}</td></tr>`).join('')}<tr class="tot"><td>Totals</td><td class="n">${sum('AB')}</td><td class="n">${sum('R')}</td><td class="n">${sum('H')}</td><td class="n">${sum('RBI')}</td><td class="n">${sum('BB')}</td><td class="n">${sum('SO')}</td><td class="n">${sum('HR')}</td></tr></tbody></table>
      <table class="box"><thead><tr><th>Pitcher</th><th class="n">IP</th><th class="n">H</th><th class="n">R</th><th class="n">ER</th><th class="n">BB</th><th class="n">SO</th><th class="n">HR</th></tr></thead><tbody>${pit.map(x => `<tr><td>${esc(x.name)}${x.dec ? ` <b>(${x.dec})</b>` : ''}</td><td class="n">${esc(ipText(x))}</td><td class="n">${x.H}</td><td class="n">${x.R}</td><td class="n">${x.ER}</td><td class="n">${x.BB}</td><td class="n">${x.SO}</td><td class="n">${x.HR}</td></tr>`).join('')}</tbody></table></div>`;
  }
  function updateFinal() {
    const el = $('fin'); if (!el) return;
    if (S.idx < S.log.length) { el.hidden = true; return; }
    const R = S.result, g = S.game, win = R.winner, recorded = g.status === 'final';
    const decs = R.pitching.flat().filter(x => x.dec).map(x => `${x.dec}: ${x.name}`).join(' · ');
    el.hidden = false;
    el.innerHTML = `<h2>Final</h2><p class="big-score">${esc(R.names[win])} win, ${Math.max(R.away_runs, R.home_runs)} to ${Math.min(R.away_runs, R.home_runs)}</p><p class="note">${esc(decs)}</p>
      ${S.finishing ? '<p class="msg">Recording the result…</p>' : S.finishErr ? `<p class="msg err" role="alert">${esc(S.finishErr)}</p><div class="row" style="justify-content:center"><button class="btn" id="retry">Try again</button></div>` : recorded ? '<p class="msg ok">The result is official and counts in the standings.</p>' : ''}
      <div class="row" style="justify-content:center"><a class="btn" href="season.html?league=${g.league_id}">Back to the season</a></div>
      <div style="text-align:left"><h2 style="margin-top:20px">Box score</h2>${boxTable(R, 0)}${boxTable(R, 1)}</div>`;
    const rb = $('retry'); if (rb) rb.onclick = finish;
  }

  window.addEventListener('cc-auth', () => load());
  setInterval(() => { if (!document.hidden && S.mode === 'msg' && S.game && S.game.status === 'in_progress') load(); }, 20000);
  (window.CC ? window.CC.whenReady.bind(window.CC) : fn => fn())(load);
})();
</script>
</body>
